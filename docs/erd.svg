<svg viewBox="0 0 1100 820" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <style>
      .table-header { fill: #1e293b; }
      .table-body   { fill: #0f172a; }
      .table-border { stroke: #334155; stroke-width: 1.5; fill: none; }
      .col-text     { fill: #94a3b8; font-size: 11px; }
      .pk-text      { fill: #f59e0b; font-size: 11px; font-weight: bold; }
      .fk-text      { fill: #60a5fa; font-size: 11px; }
      .header-text  { fill: #f8fafc; font-size: 12px; font-weight: bold; letter-spacing: 0.5px; }
      .enum-badge   { fill: #7c3aed; }
      .enum-text    { fill: #ddd6fe; font-size: 9px; }
      .rel-line     { stroke: #475569; stroke-width: 1.2; fill: none; }
      .rel-line-hi  { stroke: #3b82f6; stroke-width: 1.2; fill: none; stroke-dasharray: 4,2; }
      .title-text   { fill: #f8fafc; font-size: 22px; font-weight: bold; letter-spacing: -0.5px; }
      .sub-text     { fill: #64748b; font-size: 12px; }
      .note-bg      { fill: #0f172a; stroke: #1e3a5f; stroke-width: 1; }
      .note-text    { fill: #60a5fa; font-size: 10px; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#475569"/>
    </marker>
    <marker id="arrow-hi" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3b82f6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" fill="#020617"/>

  <!-- Grid dots -->
  <pattern id="dots" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="0.8" fill="#1e293b"/>
  </pattern>
  <rect width="1100" height="820" fill="url(#dots)"/>

  <!-- Title -->
  <text x="30" y="45" class="title-text">UniMarket Pakistan — ER Diagram</text>
  <text x="30" y="65" class="sub-text">PostgreSQL schema · Flask-SQLAlchemy · 10 tables</text>

  <!-- ===== university_registry ===== -->
  <g transform="translate(30, 90)">
    <rect width="190" height="130" rx="4" class="table-border"/>
    <rect width="190" height="28" rx="4" class="table-header"/>
    <rect y="28" width="190" height="102" rx="0" class="table-body"/>
    <text x="10" y="19" class="header-text">university_registry</text>
    <text x="10" y="46"  class="pk-text">PK  uni_id        INTEGER</text>
    <text x="10" y="62"  class="col-text">    name          VARCHAR(100)</text>
    <text x="10" y="78"  class="col-text">    city          VARCHAR(100)</text>
    <text x="10" y="94"  class="col-text">    province      VARCHAR(100)</text>
    <text x="10" y="110" class="col-text">    hec_status    ENUM</text>
    <text x="10" y="126" class="col-text">    active_users  INTEGER</text>
  </g>

  <!-- ===== users ===== -->
  <g transform="translate(290, 90)">
    <rect width="210" height="180" rx="4" class="table-border"/>
    <rect width="210" height="28" rx="4" class="table-header"/>
    <rect y="28" width="210" height="152" rx="0" class="table-body"/>
    <text x="10" y="19" class="header-text">users</text>
    <text x="10" y="46"  class="pk-text">PK  user_id       INTEGER</text>
    <text x="10" y="62"  class="col-text">    full_name     VARCHAR(150)</text>
    <text x="10" y="78"  class="col-text">    email         VARCHAR(120)</text>
    <text x="10" y="94"  class="col-text">    password_hash VARCHAR(128)</text>
    <text x="10" y="110" class="col-text">    student_id    VARCHAR(50)</text>
    <text x="10" y="126" class="fk-text">FK  uni_affil     → university</text>
    <text x="10" y="142" class="col-text">    role          ENUM</text>
    <text x="10" y="158" class="col-text">    avg_rating    NUMERIC(3,2)</text>
    <text x="10" y="174" class="col-text">    active_status ENUM</text>
  </g>

  <!-- ===== item_registry ===== -->
  <g transform="translate(570, 90)">
    <rect width="220" height="230" rx="4" class="table-border"/>
    <rect width="220" height="28" rx="4" class="table-header"/>
    <rect y="28" width="220" height="202" rx="0" class="table-body"/>
    <text x="10" y="19" class="header-text">item_registry</text>
    <text x="10" y="46"  class="pk-text">PK  item_id       INTEGER</text>
    <text x="10" y="62"  class="fk-text">FK  owner_id      → users</text>
    <text x="10" y="78"  class="col-text">    title         VARCHAR(200)</text>
    <text x="10" y="94"  class="col-text">    description   TEXT</text>
    <text x="10" y="110" class="col-text">    category      ENUM</text>
    <text x="10" y="126" class="col-text">    condition     ENUM</text>
    <text x="10" y="142" class="col-text">    listing_type  ENUM</text>
    <text x="10" y="158" class="col-text">    avail_status  ENUM</text>
    <text x="10" y="174" class="col-text">    price_per_day NUMERIC(10,2) ≥0</text>
    <text x="10" y="190" class="col-text">    sale_price    NUMERIC(10,2) ≥0</text>
    <text x="10" y="206" class="col-text">    security_dep  NUMERIC(10,2) ≥0</text>
    <text x="10" y="222" class="fk-text">FK  location_uni  → university</text>
  </g>

  <!-- ===== item_images ===== -->
  <g transform="translate(860, 90)">
    <rect width="200" height="115" rx="4" class="table-border"/>
    <rect width="200" height="28" rx="4" class="table-header"/>
    <rect y="28" width="200" height="87" rx="0" class="table-body"/>
    <text x="10" y="19" class="header-text">item_images</text>
    <text x="10" y="46" class="pk-text">PK  id            INTEGER</text>
    <text x="10" y="62" class="fk-text">FK  item_id       → item_registry</text>
    <text x="10" y="78" class="col-text">    image_url     VARCHAR(500)</text>
    <text x="10" y="94" class="col-text">    is_primary    BOOLEAN</text>
  </g>

  <!-- ===== EER Subclasses ===== -->
  <!-- electronics -->
  <g transform="translate(860, 240)">
    <rect width="200" height="115" rx="4" class="table-border" style="stroke:#7c3aed"/>
    <rect width="200" height="28" rx="4" fill="#4c1d95"/>
    <rect y="28" width="200" height="87" rx="0" class="table-body"/>
    <text x="10" y="19" class="header-text" style="fill:#ddd6fe">electronics ⊂ item</text>
    <text x="10" y="46" class="pk-text">PK  spec_id       INTEGER</text>
    <text x="10" y="62" class="fk-text">FK  item_id       → item_registry</text>
    <text x="10" y="78" class="col-text">    brand, voltage</text>
    <text x="10" y="94" class="col-text">    battery_type, wattage</text>
  </g>

  <!-- tools -->
  <g transform="translate(860, 390)">
    <rect width="200" height="100" rx="4" class="table-border" style="stroke:#7c3aed"/>
    <rect width="200" height="28" rx="4" fill="#4c1d95"/>
    <rect y="28" width="200" height="72" rx="0" class="table-body"/>
    <text x="10" y="19" class="header-text" style="fill:#ddd6fe">tools ⊂ item</text>
    <text x="10" y="46" class="pk-text">PK  spec_id       INTEGER</text>
    <text x="10" y="62" class="fk-text">FK  item_id       → item_registry</text>
    <text x="10" y="78" class="col-text">    power_source, weight_kg, tool_type</text>
  </g>

  <!-- vehicles -->
  <g transform="translate(860, 520)">
    <rect width="200" height="100" rx="4" class="table-border" style="stroke:#7c3aed"/>
    <rect width="200" height="28" rx="4" fill="#4c1d95"/>
    <rect y="28" width="200" height="72" rx="0" class="table-body"/>
    <text x="10" y="19" class="header-text" style="fill:#ddd6fe">vehicles ⊂ item</text>
    <text x="10" y="46" class="pk-text">PK  spec_id       INTEGER</text>
    <text x="10" y="62" class="fk-text">FK  item_id       → item_registry</text>
    <text x="10" y="78" class="col-text">    frame_size, gear_count, fuel_type</text>
  </g>

  <!-- ===== rentals ===== -->
  <g transform="translate(290, 340)">
    <rect width="210" height="185" rx="4" class="table-border"/>
    <rect width="210" height="28" rx="4" class="table-header"/>
    <rect y="28" width="210" height="157" rx="0" class="table-body"/>
    <text x="10" y="19" class="header-text">rentals</text>
    <text x="10" y="46"  class="pk-text">PK  rental_id     INTEGER</text>
    <text x="10" y="62"  class="fk-text">FK  item_id       → item_registry</text>
    <text x="10" y="78"  class="fk-text">FK  borrower_id   → users</text>
    <text x="10" y="94"  class="fk-text">FK  owner_id      → users</text>
    <text x="10" y="110" class="col-text">    start_time    TIMESTAMPTZ</text>
    <text x="10" y="126" class="col-text">    end_time      TIMESTAMPTZ</text>
    <text x="10" y="142" class="col-text">    total_cost    NUMERIC ≥0</text>
    <text x="10" y="158" class="col-text">    status        ENUM</text>
    <text x="10" y="174" class="col-text">    CHECK end > start</text>
  </g>

  <!-- ===== transactions ===== -->
  <g transform="translate(30, 400)">
    <rect width="220" height="160" rx="4" class="table-border"/>
    <rect width="220" height="28" rx="4" class="table-header"/>
    <rect y="28" width="220" height="132" rx="0" class="table-body"/>
    <text x="10" y="19" class="header-text">transactions (weak)</text>
    <text x="10" y="46"  class="pk-text">PK  txn_id        INTEGER</text>
    <text x="10" y="62"  class="fk-text">FK  rental_id     → rentals</text>
    <text x="10" y="78"  class="col-text">    amount        NUMERIC &gt;0</text>
    <text x="10" y="94"  class="col-text">    txn_type      ENUM</text>
    <text x="10" y="110" class="col-text">    method        ENUM</text>
    <text x="10" y="126" class="col-text">    txn_date      TIMESTAMPTZ</text>
    <text x="10" y="142" class="col-text">    status        ENUM</text>
  </g>

  <!-- ===== reviews ===== -->
  <g transform="translate(30, 600)">
    <rect width="220" height="175" rx="4" class="table-border"/>
    <rect width="220" height="28" rx="4" class="table-header"/>
    <rect y="28" width="220" height="147" rx="0" class="table-body"/>
    <text x="10" y="19" class="header-text">reviews (weak)</text>
    <text x="10" y="46"  class="pk-text">PK  review_id     INTEGER</text>
    <text x="10" y="62"  class="fk-text">FK  rental_id     → rentals (UNIQUE)</text>
    <text x="10" y="78"  class="fk-text">FK  reviewer_id   → users</text>
    <text x="10" y="94"  class="fk-text">FK  reviewed_uid  → users</text>
    <text x="10" y="110" class="col-text">    rating        INTEGER 1–5</text>
    <text x="10" y="126" class="col-text">    comment_text  TEXT</text>
    <text x="10" y="142" class="col-text">    reviewed_date TIMESTAMPTZ</text>
    <text x="10" y="158" class="col-text">    TRIGGER → users.avg_rating</text>
  </g>

  <!-- ===== orders ===== -->
  <g transform="translate(570, 400)">
    <rect width="230" height="175" rx="4" class="table-border"/>
    <rect width="230" height="28" rx="4" class="table-header"/>
    <rect y="28" width="230" height="147" rx="0" class="table-body"/>
    <text x="10" y="19" class="header-text">orders</text>
    <text x="10" y="46"  class="pk-text">PK  order_id      INTEGER</text>
    <text x="10" y="62"  class="fk-text">FK  buyer_id      → users</text>
    <text x="10" y="78"  class="fk-text">FK  seller_id     → users</text>
    <text x="10" y="94"  class="fk-text">FK  item_id       → item_registry</text>
    <text x="10" y="110" class="col-text">    amount        NUMERIC &gt;0</text>
    <text x="10" y="126" class="col-text">    payment_method ENUM</text>
    <text x="10" y="142" class="col-text">    status        ENUM</text>
    <text x="10" y="158" class="col-text">    created_at    TIMESTAMPTZ</text>
  </g>

  <!-- ===== Relationship lines ===== -->
  <!-- university → users -->
  <line x1="220" y1="150" x2="290" y2="160" class="rel-line" marker-end="url(#arrow)"/>
  <!-- university → item_registry -->
  <line x1="220" y1="170" x2="570" y2="295" class="rel-line" marker-end="url(#arrow)"/>
  <!-- users → item_registry (owner) -->
  <line x1="500" y1="160" x2="570" y2="155" class="rel-line" marker-end="url(#arrow)"/>
  <!-- item_registry → item_images -->
  <line x1="790" y1="135" x2="860" y2="135" class="rel-line" marker-end="url(#arrow)"/>
  <!-- item_registry → electronics (dashed, EER subclass) -->
  <line x1="790" y1="200" x2="860" y2="290" class="rel-line-hi" marker-end="url(#arrow-hi)"/>
  <!-- item_registry → tools -->
  <line x1="790" y1="230" x2="860" y2="430" class="rel-line-hi" marker-end="url(#arrow-hi)"/>
  <!-- item_registry → vehicles -->
  <line x1="790" y1="260" x2="860" y2="555" class="rel-line-hi" marker-end="url(#arrow-hi)"/>
  <!-- item_registry → rentals (item_id FK) -->
  <line x1="570" y1="260" x2="500" y2="380" class="rel-line" marker-end="url(#arrow)"/>
  <!-- users → rentals (borrower) -->
  <line x1="370" y1="270" x2="370" y2="340" class="rel-line" marker-end="url(#arrow)"/>
  <!-- rentals → transactions -->
  <line x1="290" y1="430" x2="250" y2="450" class="rel-line" marker-end="url(#arrow)"/>
  <!-- rentals → reviews -->
  <line x1="310" y1="525" x2="200" y2="620" class="rel-line" marker-end="url(#arrow)"/>
  <!-- item_registry → orders (item_id) -->
  <line x1="650" y1="320" x2="660" y2="400" class="rel-line" marker-end="url(#arrow)"/>
  <!-- users → orders (buyer/seller) -->
  <line x1="430" y1="230" x2="575" y2="430" class="rel-line" marker-end="url(#arrow)"/>

  <!-- ===== Legend ===== -->
  <g transform="translate(290, 620)">
    <rect width="510" height="155" rx="6" class="note-bg"/>
    <text x="15" y="22" class="header-text" style="fill:#94a3b8">Legend &amp; Key Design Decisions</text>
    <text x="15" y="42" class="pk-text">▪ PK  Primary Key (SERIAL / sequence-backed)</text>
    <text x="15" y="58" class="fk-text">▪ FK  Foreign Key  (CASCADE or RESTRICT enforced by PostgreSQL)</text>
    <text x="15" y="74" class="note-text" style="fill:#ddd6fe">▪ Purple tables = EER specialization (1:1 with item_registry)</text>
    <text x="15" y="90" class="note-text">▪ Dashed lines = EER IS-A / specialization relationships</text>
    <text x="15" y="106" class="note-text">▪ All ENUMs are native PostgreSQL CREATE TYPE (not VARCHAR CHECK)</text>
    <text x="15" y="122" class="note-text">▪ All DateTimes are TIMESTAMPTZ (timezone-aware UTC)</text>
    <text x="15" y="138" class="note-text">▪ avg_rating updated atomically by PostgreSQL TRIGGER trg_avg_rating</text>
  </g>
</svg>
